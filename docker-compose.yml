name: tyrestock

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tyrestock}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tyrestock}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tyrestock}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - web
      - app-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-tyrestock}.rule=Host(`${DOMAIN:-localhost}`)"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-tyrestock}.entrypoints=websecure"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-tyrestock}.tls=true"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-tyrestock}.tls.certresolver=letsencrypt"
      - "traefik.http.services.${TRAEFIK_ROUTER:-tyrestock}.loadbalancer.server.port=80"

volumes:
  postgres_data:

networks:
  app-net:
    driver: bridge
  web:
    external: true
