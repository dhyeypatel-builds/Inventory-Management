# Port overrides for the dev environment on a shared VPS.
# Prod runs on 3000/3001 (docker-compose.yml defaults).
# Dev runs on 3010/3011 so the two stacks don't collide.
#
# Usage:
#   docker compose -p tyrestock-dev \
#     -f docker-compose.yml \
#     -f docker-compose.dev-server.yml \
#     up -d --build

services:
  frontend:
    ports:
      - "3010:80"
  backend:
    ports:
      - "3011:3001"
